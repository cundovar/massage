# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    app.images_directory: '%kernel.project_dir%/public/images'
    app.doctrine_table_prefix: 'massage_'
    app.admin_email: '%env(ADMIN_EMAIL)%'
    app.mailer_from_email: '%env(MAILER_FROM_EMAIL)%'
    app.mailer_from_name: '%env(MAILER_FROM_NAME)%'
    app.frontend_url: '%env(FRONTEND_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Service\MediaUploader:
        arguments:
            $imagesDirectory: '%app.images_directory%'

    App\Controller\ImageProxyController:
        arguments:
            $imagesDirectory: '%app.images_directory%'

    App\Doctrine\TablePrefixSubscriber:
        arguments:
            $prefix: '%app.doctrine_table_prefix%'

    App\Service\NotificationService:
        arguments:
            $adminEmail: '%app.admin_email%'
            $fromEmail: '%app.mailer_from_email%'
            $fromName: '%app.mailer_from_name%'

    App\Service\PasswordResetService:
        arguments:
            $frontendUrl: '%app.frontend_url%'
            $fromEmail: '%app.mailer_from_email%'
            $fromName: '%app.mailer_from_name%'
